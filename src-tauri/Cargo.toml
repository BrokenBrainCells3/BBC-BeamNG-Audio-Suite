[package]
name = "brokenbraincells-beamng-dsp"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[[bin]]
name = "brokenbraincells-beamng-dsp"
path = "src/main.rs"

[lib]
name = "audio_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
rustfft = "6"
num-complex = "0.4"
base64 = "0.21"
rodio = { version = "0.17", features = ["mp3"] }
symphonia = { version = "0.5", features = ["mp3", "aac", "ogg", "wav", "flac", "pcm"] }
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
chrono = "0.4"
rubato = "0.15"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
socket2 = "0.5"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "net", "time"] }
walkdir = "2"
tiny_http = "0.12"
thread-priority = "3.0.0"
crossbeam-queue = "0.3.12"
# Opera-window streamer (WebSocket JPEG broadcast, same protocol as window_streamer)
tokio-tungstenite = "0.21"
futures = "0.3"
jpeg-encoder = "0.6.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
      "Win32_Foundation",
      "Win32_Graphics_Gdi",
      "Win32_Security",
      "Win32_Storage_FileSystem",
      "Win32_System_Threading",
      "Win32_UI_Input_KeyboardAndMouse",
      "Win32_UI_Shell",
      "Win32_UI_WindowsAndMessaging",
      "Media_Control",
    "Foundation",
    "Foundation_Collections",
    "Storage",
    "Storage_Streams",
] }
# GPU capture (WGC) + GDI fallback for the embedded Opera child window.
# wgc drives its own windows 0.62 — we transmute the HWND pointer (same trick
# as window_streamer) so it coexists with our windows 0.58.
wgc = "2.0.1"
winapi = { version = "0.3", features = ["winuser", "wingdi", "windef", "minwindef", "dwmapi"] }
# Faster production builds
[profile.release]
opt-level = 1          # Huge speed improvement vs 3
incremental = true     # Enable incremental builds in release
codegen-units = 16     # More parallel compilation
lto = false            # Disable slow link-time optimization
debug = false          # No debug symbols (faster)
